name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project.zip
        run: |
          unzip -o project.zip -d extracted_app
          ls extracted_app/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create local.properties
        working-directory: ./extracted_app
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          cat android/local.properties

      - name: Patch old plugins
        working-directory: ./extracted_app
        run: |
          flutter pub get
          SS_DIR="$PUB_CACHE/hosted/pub.dev/shared_storage-0.8.1/android"
          # Fix 1: jcenter -> mavenCentral
          find $PUB_CACHE/hosted/pub.dev -name "build.gradle" -path "*/android/*" -exec sed -i 's/jcenter()/mavenCentral()/g' {} \; 2>/dev/null || true
          # Fix 2: namespace
          if [ -f "$SS_DIR/build.gradle" ] && ! grep -q "namespace" "$SS_DIR/build.gradle"; then
            sed -i '/^android {/a \    namespace = "io.alexrintt.sharedstorage"' "$SS_DIR/build.gradle"
          fi
          # Fix 3: remove package attr from manifest
          if [ -f "$SS_DIR/src/main/AndroidManifest.xml" ]; then
            sed -i 's/ package="[^"]*"//' "$SS_DIR/src/main/AndroidManifest.xml"
          fi
          # Fix 4: JVM target
          if [ -f "$SS_DIR/build.gradle" ]; then
            if ! grep -q "sourceCompatibility" "$SS_DIR/build.gradle"; then
              sed -i '/^android {/a \    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }' "$SS_DIR/build.gradle"
            fi
            if ! grep -q 'jvmTarget' "$SS_DIR/build.gradle"; then
              sed -i '/^android {/a \    kotlinOptions {\n        jvmTarget = "17"\n    }' "$SS_DIR/build.gradle"
            fi
          fi
          # Fix 5: compileSdk 34 for shared_storage (lStar needs API 31+)
          if [ -f "$SS_DIR/build.gradle" ]; then
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' "$SS_DIR/build.gradle"
            sed -i 's/compileSdk [0-9]*/compileSdk = 34/g' "$SS_DIR/build.gradle"
            if ! grep -q "compileSdk" "$SS_DIR/build.gradle"; then
              sed -i '/^android {/a \    compileSdkVersion 34' "$SS_DIR/build.gradle"
            fi
          fi
          echo "All plugin patches applied"

      - name: Build APK
        working-directory: ./extracted_app
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ready-APK
          path: extracted_app/build/app/outputs/flutter-apk/*.apk
