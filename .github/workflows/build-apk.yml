name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project.zip
        run: |
          unzip -o project.zip -d extracted_app
          ls extracted_app/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create local.properties
        working-directory: ./extracted_app
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          cat android/local.properties

      - name: Patch old plugins
        working-directory: ./extracted_app
        run: |
          flutter pub get
          # Fix 1: Replace deprecated jcenter() with mavenCentral()
          find $PUB_CACHE/hosted/pub.dev -name "build.gradle" -path "*/android/*" -exec sed -i 's/jcenter()/mavenCentral()/g' {} \; 2>/dev/null || true
          # Fix 2: Add namespace to shared_storage plugin (required by AGP 8.x)
          SS_FILE="$PUB_CACHE/hosted/pub.dev/shared_storage-0.8.1/android/build.gradle"
          if [ -f "$SS_FILE" ]; then
            if ! grep -q "namespace" "$SS_FILE"; then
              sed -i '/^android {/a \    namespace = "com.example.shared_storage"' "$SS_FILE"
              echo "namespace added to shared_storage"
            fi
          fi
          # Fix 3: JVM target compatibility for shared_storage (javac vs kotlinc mismatch)
          SS_FILE="$PUB_CACHE/hosted/pub.dev/shared_storage-0.8.1/android/build.gradle"
          if [ -f "$SS_FILE" ]; then
            # Add compileOptions if missing
            if ! grep -q "sourceCompatibility" "$SS_FILE"; then
              sed -i '/^android {/a \    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }' "$SS_FILE"
            fi
            # Add kotlinOptions jvmTarget if missing
            if ! grep -q "jvmTarget" "$SS_FILE"; then
              sed -i '/^android {/a \    kotlinOptions {\n        jvmTarget = "17"\n    }' "$SS_FILE"
            fi
            echo "JVM target patched for shared_storage"
          fi
          echo "Plugin patches applied"

      - name: Build APK
        working-directory: ./extracted_app
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ready-APK
          path: extracted_app/build/app/outputs/flutter-apk/*.apk
